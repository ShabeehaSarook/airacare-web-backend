<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Airacare Web Safety</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="camera-stage">
        <video id="cameraVideo" playsinline muted></video>
        <canvas id="overlayCanvas"></canvas>
        <div class="top-panel">
          <div>
            <p>Airacare</p>
            <h1>Animal Safety</h1>
          </div>
          <span id="statusPill">Idle</span>
        </div>
        <div id="warningBanner" class="warning-banner" hidden></div>
      </section>

      <section class="control-panel">
        <div class="stats-grid">
          <div>
            <span>Class</span>
            <strong id="latestLabel">None</strong>
          </div>
          <div>
            <span>Distance</span>
            <strong id="latestDistance">N/A</strong>
          </div>
          <div>
            <span>Risk</span>
            <strong id="latestRisk">N/A</strong>
          </div>
          <div>
            <span>Firebase</span>
            <strong id="firebaseStatus">Ready</strong>
          </div>
        </div>

        <div class="button-row">
          <button id="startButton" type="button">Start</button>
          <button id="stopButton" type="button" disabled>Stop</button>
        </div>

        <div class="target-strip" aria-label="Target classes">
          <span>person</span>
          <span>dog</span>
          <span>cat</span>
          <span>horse</span>
          <span>cow</span>
          <span>deer</span>
          <span>goat</span>
        </div>

        <div class="history-header">
          <h2>Recent Detections</h2>
          <span id="modelStatus">Model waiting</span>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <canvas id="captureCanvas" hidden></canvas>
    <script type="module" src="./app.js"></script>
  </body>
</html>

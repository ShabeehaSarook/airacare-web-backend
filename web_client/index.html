<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Airacare Web Safety</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="camera-stage">
        <video id="cameraVideo" playsinline muted></video>
        <canvas id="overlayCanvas"></canvas>
        <div class="top-panel">
          <div>
            <p>Airacare</p>
            <h1>Animal Safety</h1>
          </div>
          <span id="statusPill">Idle</span>
        </div>
        <div id="warningBanner" class="warning-banner" hidden></div>
      </section>

      <section class="control-panel">
        <div class="stats-grid">
          <div>
            <span>Class</span>
            <strong id="latestLabel">None</strong>
          </div>
          <div>
            <span>Distance</span>
            <strong id="latestDistance">N/A</strong>
          </div>
          <div>
            <span>Risk</span>
            <strong id="latestRisk">N/A</strong>
          </div>
          <div>
            <span>Firebase</span>
            <strong id="firebaseStatus">Ready</strong>
          </div>
        </div>

        <div class="button-row">
          <button id="startButton" type="button">Start</button>
          <button id="stopButton" type="button" disabled>Stop</button>
        </div>
        <button id="captureStoreButton" class="capture-store-button" type="button" hidden disabled>
          Capture &amp; Store
        </button>
        <p id="captureStoreStatus" class="capture-store-status" aria-live="polite"></p>

        <div class="target-strip" aria-label="Target classes">
          <span>person</span>
          <span>dog</span>
          <span>cat</span>
          <span>horse</span>
          <span>cow</span>
          <span>deer</span>
          <span>goat</span>
        </div>

        <div class="history-header">
          <h2>Recent Detections</h2>
          <span id="modelStatus">Model waiting</span>
        </div>
        <div id="historyList" class="history-list"></div>

        <div class="collection-header">
          <h2>My Collection</h2>
          <div class="collection-tabs" aria-label="Collection filters">
            <button class="collection-tab active" data-filter="all" type="button">All</button>
            <button class="collection-tab" data-filter="dog" type="button">Dogs</button>
            <button class="collection-tab" data-filter="cat" type="button">Cats</button>
          </div>
        </div>
        <div id="collectionList" class="collection-list"></div>
      </section>
    </main>

    <canvas id="captureCanvas" hidden></canvas>
    <canvas id="petCropCanvas" hidden></canvas>

    <div id="captureModal" class="modal-backdrop" hidden>
      <section class="capture-modal" role="dialog" aria-modal="true" aria-labelledby="captureModalTitle">
        <h2 id="captureModalTitle">Captured Pet</h2>
        <img id="capturePreviewImage" alt="Captured pet sticker preview" />
        <dl class="capture-metadata">
          <div>
            <dt>Class</dt>
            <dd id="capturePreviewLabel">N/A</dd>
          </div>
          <div>
            <dt>Confidence</dt>
            <dd id="capturePreviewConfidence">N/A</dd>
          </div>
          <div>
            <dt>Captured</dt>
            <dd id="capturePreviewTime">N/A</dd>
          </div>
        </dl>
        <p id="capturePreviewNote" class="capture-store-status"></p>
        <div class="button-row">
          <button id="cancelCaptureButton" type="button">Cancel</button>
          <button id="saveCaptureButton" type="button">Save to Collection</button>
        </div>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
